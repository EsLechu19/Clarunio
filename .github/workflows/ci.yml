name: Validaciones reproducibles

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - name: Expo Doctor (informativo)
        run: npx expo-doctor || echo "Expo Doctor reportó advertencias; revisar el resultado sin presentar validación nativa como completada."
